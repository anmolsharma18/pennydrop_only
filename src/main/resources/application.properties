server.address=127.0.0.1
server.port=8080
portal.scheduler-enabled=true
portal.scheduler-directory=data/scheduler
portal.scheduler-poll-ms=1000
portal.admin-cleanup.enabled=true
portal.admin-cleanup.url=https://live.meon.co.in/admin/democapital
portal.admin-cleanup.credentials-directory=data/admin
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
portal.chrome-version=151
portal.wait-seconds=40
portal.settle-seconds=8
# Leave applicant/bank details empty; supply your authorized QA values in the portal.
portal.defaults.mobile=${KYC_DEFAULT_MOBILE:}
portal.defaults.dependency=${KYC_DEFAULT_DEPENDENCY:Self}
portal.defaults.name=${KYC_DEFAULT_NAME:}
portal.defaults.ifsc=${KYC_DEFAULT_IFSC:}
portal.defaults.account-number=${KYC_DEFAULT_ACCOUNT_NUMBER:}
portal.defaults.confirm-account-number=${KYC_DEFAULT_CONFIRM_ACCOUNT_NUMBER:}
portal.defaults.account-type=${KYC_DEFAULT_ACCOUNT_TYPE:}
portal.defaults.otp-mode=RANDOM
portal.defaults.fixed-otp=
portal.defaults.browser-mode=VISIBLE
# Provisional: source evidence in inspection/index.js, not verified in post-OTP DOM.
portal.locators.otp-submit-xpath=//button[@id='SaveData' and (translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ')='SUBMIT' or translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ')='VERIFY OTP')]
portal.locators.micr-css=#micr1
portal.locators.bank-address-css=#bank_address

# Persisted form values and optional SMTP sender. Routine inputs/recipients are edited in the portal.
portal.profile-directory=data/profile
portal.mail.host=${PORTAL_SMTP_HOST:}
portal.mail.port=${PORTAL_SMTP_PORT:587}
portal.mail.from=${PORTAL_SMTP_FROM:}
portal.mail.username=${PORTAL_SMTP_USERNAME:}
portal.mail.password=${PORTAL_SMTP_PASSWORD:}
portal.mail.security=${PORTAL_SMTP_SECURITY:STARTTLS}
portal.mail.enabled=true
portal.mail.credentials-directory=data/mail
# Total unencoded screenshot + workbook attachment bytes per success email.
portal.mail.max-attachment-bytes=18874368
